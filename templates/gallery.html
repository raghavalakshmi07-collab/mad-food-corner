
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Gallery - MAD Food Corner</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff8ef;
            color: #333;
        }

        header {
            background: #680e0e;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            color: #ffe1b0;
        }

        .back-link {
            display: inline-block;
            margin-top: 10px;
            color: #ffc629;
            text-decoration: none;
            font-weight: bold;
        }

        .gallery {
            width: 92%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .gallery h2 {
            text-align: center;
            color: #741515;
            font-size: 28px;
        }

        .gallery-intro {
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .gallery-card {
            background: white;
            padding: 12px;
            border-radius: 14px;
            border: 1px solid #edc7a7;
            box-shadow: 0 4px 12px rgba(70, 30, 10, 0.1);
        }

        .gallery-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 9px;
            display: block;
        }

        .gallery-card h3 {
            color: #741515;
            text-align: center;
            margin-bottom: 5px;
        }

        footer {
            background: #680e0e;
            color: white;
            text-align: center;
            padding: 18px;
            margin-top: 35px;
        }

        @media (max-width: 600px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }

            .gallery-card img {
                height: 240px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>📸 MAD Food Corner</h1>
    <p>A glimpse of our shop and special moments!</p>
    <a class="back-link" href="{{ url_for('home') }}">← Back to Home</a>
</header>

<main class="gallery">
    <h2>Our Shop Gallery</h2>
    <p class="gallery-intro">
        Take a look at our shop through these real photos.
        We are happy to share our place with you!
    </p>

   
<div class="gallery-grid">

    <div class="gallery-card">
        <img src="{{ url_for('static', filename='images/shop (1).jpg') }}"
             alt="MAD Food Corner - Photo 1">
        <h3>Our Shop</h3>
    </div>

    <div class="gallery-card">
        <img src="{{ url_for('static', filename='images/shop(2).jpg') }}"
             alt="MAD Food Corner - Photo 2">
        <h3>Shop Moments</h3>
    </div>

    <div class="gallery-card">
        <img src="{{ url_for('static', filename='images/shop(3).jpg') }}"
             alt="MAD Food Corner - Photo 3">
        <h3>Our Place</h3>
    </div>

    <div class="gallery-card">
        <img src="{{ url_for('static', filename='images/shop(4).jpg') }}"
             alt="MAD Food Corner - Photo 4">
        <h3>Visit Us</h3>
    </div>

</div>

    </div>
</main>

<footer>
    <p>© MAD Food Corner | Fresh Food, Happy Moments!</p>
</footer>

</body>
</html>
