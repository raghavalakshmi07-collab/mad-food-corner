
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Login - MAD Food Corner</title>
</head>
<body style="font-family:Arial;background:#fff8f0;padding:30px;text-align:center">
    <h1>MAD Food Corner - Owner Login</h1>

    <form method="POST">
        <p>
            <input name="username" placeholder="Username"
                   required>
        </p>
        <p>
            <input name="password" type="password"
                   placeholder="Password" required>
        </p>
        <button type="submit">Login</button>
    </form>

    {% if error_message %}
        <p style="color:red">{{ error_message }}</p>
    {% endif %}
</body>
</html>
